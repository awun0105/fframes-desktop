[package]
name = "vinuni-future-rises"
version = "1.2.0"
edition = "2024"
publish = false

[dependencies]
fframes = { workspace = true, features = ["compile-time-svgtree", "cli"] }
fframes-components = { version = "0.1.2", default-features = false, features = ["glitch-cycle", "multi-text-typewriter", "spring-scale-in", "typing-code-block"] }

# Metal on macOS, Vulkan everywhere else (Skia on the CPU when Vulkan is unavailable)
[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["metal"] }
fframes_native_player = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }
fframes_native_player.workspace = true

[target.'cfg(not(windows))'.dependencies]
fframes = { workspace = true, features = ["h264", "libav-agree-gpl"] }

# Keep FFmpeg source fallbacks portable across CI runner CPUs (see README).
[target.'cfg(not(any(target_arch = "wasm32", windows)))'.dependencies]
fframes = { workspace = true, features = ["build-portable"] }

[lib]
name = "vinuni_future_rises"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "vinuni-future-rises"
path = "src/main.rs"

[lints]
workspace = true
