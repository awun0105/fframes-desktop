[workspace]
resolver = "2"
members = ["fframes-kit", "gallery", "gallery/editor/editor-bridge"]

[workspace.dependencies]
fframes = { path = "../fframes", version = "1.3.0" }
fframes_skia_renderer = { path = "../fframes-skia-renderer", version = "1.3.0" }
fframes-editor-controller = { path = "../fframes-editor-controller" }
fframes-kit = { path = "fframes-kit" }
kurbo = "0.13"

# Copied from the root workspace so the kit is held to the same bar.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
    'cfg(fframes_docsrs)',
] }

# `just clippy` runs `cargo clippy --all-targets -- -D warnings` on top of this table.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
option_map_unit_fn = "allow"
module_inception = "allow"
single_match = "allow"
single_range_in_vec_init = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
ref_option = "allow"
trivially_copy_pass_by_ref = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
inline_always = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
float_cmp = "allow"
