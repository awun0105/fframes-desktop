[workspace]
resolver = "2"
members = ["fframes-kit", "fframes-kit-macros", "gallery", "gallery/editor/editor-bridge"]

[workspace.dependencies]
# Without default features here: a member may not turn off what the workspace turns on
# (Studio's pinned cargo refuses it when a project depends on the kit by path).
fframes = { path = "../fframes", version = "1.3.0", default-features = false }
fframes_skia_renderer = { path = "../fframes-skia-renderer", version = "1.3.0" }
fframes-editor-controller = { path = "../fframes-editor-controller" }
fframes-kit = { path = "fframes-kit" }
fframes-kit-macros = { path = "fframes-kit-macros" }
# The props document and schemas shared with fframes Studio (kit feature `studio`).
fframes-studio-protocol = { path = "../fframes-studio-protocol" }
serde_json = "1.0"
kurbo = "0.13"
# The chemistry kit: SMILES to 2D depictions, and the periodic table's data.
chematic = { version = "1.2.1", default-features = false, features = ["smiles", "depict"] }
mendeleev = { version = "0.8.4", default-features = false, features = ["symbol", "name", "atomic_number", "atomic_weight", "period", "group_number", "element_list", "electronic_configuration", "atomic_radius", "ionization_energy"] }
# Pinned like svgr-macro.
proc-macro2 = "1"
quote = "1.0.38"
syn = "2"

# Copied from the root workspace so the kit is held to the same bar.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
    'cfg(fframes_docsrs)',
] }

# `just clippy` runs `cargo clippy --all-targets -- -D warnings` on top of this table.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
option_map_unit_fn = "allow"
module_inception = "allow"
single_match = "allow"
single_range_in_vec_init = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
ref_option = "allow"
trivially_copy_pass_by_ref = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
inline_always = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
float_cmp = "allow"
