[package]
name = "components-gallery"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
fframes.workspace = true
fframes-kit = { workspace = true, features = ["latex", "math"] }

# `--renderer cpu|skia-cpu|gpu`: Skia on Metal on macOS, on Vulkan everywhere else
[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["metal", "cli"] }

[target.'cfg(not(any(target_os = "macos", target_arch = "wasm32")))'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["vulkan", "cli"] }

# FFmpeg codecs, portable so cached source builds work across CPUs. Windows links a
# prebuilt FFmpeg instead.
[target.'cfg(not(any(target_arch = "wasm32", windows)))'.dependencies]
fframes = { workspace = true, features = ["h264", "h265", "vpx", "libav-agree-gpl", "build-portable"] }

[features]
default = ["renderer"]
renderer = ["fframes/compile-time-svgtree", "fframes/cli"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "components_gallery"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "components_gallery_bin"
path = "src/main.rs"
required-features = ["renderer"]

[lints]
workspace = true
