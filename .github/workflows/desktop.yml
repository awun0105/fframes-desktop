name: Desktop CI

# Hosted Ubuntu runs what needs a clean VM with sudo: the SDK, the package and the
# isolated-account presentation test. Tests and the real-worker integration run on the
# self-hosted runners (desktop-self-hosted.yml), which never take pull requests because this
# repository is public; pull requests from forks get the hosted tests instead.

on:
  pull_request:
    paths:
      - "desktop/**"
      - "fframes-studio-*/**"
      - "fframes/**"
      - "fframes-media/**"
      - "svgr-macro/**"
      - "media-dir-macro/**"
      - "webvtt-parser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/desktop-linux-setup/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "fframes-studio-*/**"
      - "fframes/**"
      - "fframes-media/**"
      - "svgr-macro/**"
      - "media-dir-macro/**"
      - "webvtt-parser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/desktop-linux-setup/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fork-tests:
    name: Desktop tests for a fork (ubuntu-24.04)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-linux-setup
      - name: Focused tests and lint
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all --check
          cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio
          cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio --all-targets -- -D warnings
          cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
          python3 desktop/scripts/test-packaging.py
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m0-results.json
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m2-results.json

  package:
    # macOS is paused: the studio-agent-spike process-group tests fail there (GroupSurvivors).
    name: Desktop package and presentation (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-linux-setup
      - name: Assemble and verify native offline SDK
        run: python3 desktop/scripts/assemble-phase-zero-sdk.py --out "$RUNNER_TEMP/studio-sdk"
      - name: Package native app and SDK artifact
        run: python3 desktop/scripts/package-phase-zero.py --out "$RUNNER_TEMP/fframes-studio-$TARGET" --sdk-bundle "$RUNNER_TEMP/studio-sdk"
      - name: Linux isolated-account offline native presentation, input and source click
        run: |
          sudo -E /usr/bin/python3 desktop/scripts/qualify-linux-native.py --application "$RUNNER_TEMP/fframes-studio-$TARGET/bin/fframes-studio" --bundle "$RUNNER_TEMP/studio-sdk" --out "$RUNNER_TEMP/linux-native-evidence" --isolated-user
      - name: Retain artifact and pending qualification record
        uses: actions/upload-artifact@v4
        with:
          name: studio-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/fframes-studio-x86_64-unknown-linux-gnu.zip
            ${{ runner.temp }}/linux-native-evidence/presentation.json
            ${{ runner.temp }}/linux-native-evidence/environment.json
            ${{ runner.temp }}/linux-native-evidence/native-window.png
            ${{ runner.temp }}/linux-native-evidence/application.log
          if-no-files-found: error
          retention-days: 14

  # Physical-display/IME, Windows/macOS interactive and authenticated ACP gates
  # need their own recorded runs; an Xvfb workload does not qualify those gates.
