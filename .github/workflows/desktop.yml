name: Desktop CI

# All desktop checks run on the self-hosted runners (desktop-self-hosted.yml) for every push to
# this repository. They never take pull requests because this repository is public, so pull
# requests from other repositories get the tests and lint here, on hosted Ubuntu. The GPUI fork
# spike jobs run on hosted macOS and Ubuntu for this repository's pull requests and on demand.

on:
  pull_request:
    paths:
      - "desktop/**"
      - "fframes-studio-*/**"
      - "fframes/**"
      - "fframes-media/**"
      - "svgr-macro/**"
      - "media-dir-macro/**"
      - "webvtt-parser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/desktop-linux-setup/**"
      - ".github/workflows/desktop.yml"
  # Runs the GPUI fork spike jobs on demand; the fork tests need a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fork-tests:
    name: Desktop tests for a fork (ubuntu-24.04)
    # `head.repo.fork` is true for this repository too (it is a fork of fframes), so compare names.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-linux-setup
      - name: Focused tests and lint
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all --check
          cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio
          cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio --all-targets -- -D warnings
          cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
          python3 desktop/scripts/test-packaging.py
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m0-results.json
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m2-results.json

  # Cap's GPUI fork (khanhthanhdev/zed-cap) builds and its gpui test passes on macOS. Later
  # macOS-only spikes and checks add steps here.
  gpui-spike-macos:
    name: GPUI fork spike (macos-15)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          cache-workspaces: "desktop/spikes/cap-gpui-hello -> target"
      - name: Build and test the GPUI fork spike
        working-directory: desktop/spikes/cap-gpui-hello
        run: cargo test --locked --workspace

  gpui-spike-linux:
    name: GPUI fork spike (ubuntu-24.04)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          cache-workspaces: "desktop/spikes/cap-gpui-hello -> target"
      - name: GPUI native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libfontconfig1-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libzstd-dev libvulkan-dev
      - name: Build and test the GPUI fork spike
        working-directory: desktop/spikes/cap-gpui-hello
        run: cargo test --locked --workspace
