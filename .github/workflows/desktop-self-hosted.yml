name: Desktop self-hosted validation

on:
  push:
    paths:
      - "desktop/**"
      - "fframes-studio-*/**"
      - "fframes/**"
      - "fframes-media/**"
      - "svgr-macro/**"
      - "media-dir-macro/**"
      - "webvtt-parser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-self-hosted.yml"
      - ".github/actions/desktop-windows-self-hosted-setup/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the integration tests, SDK, packaging, audio parity and the X11 shell tests"
        type: boolean
        default: false

# Heavy tests run only with Run workflow -> full while the desktop code is being refactored;
# every push runs the fast checks (fmt, tests, clippy, protocol/runtime, packaging tests).
# Run the full set before a release.

permissions:
  contents: read

concurrency:
  group: desktop-self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Desktop validation (self-hosted Linux)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          # The build folder persists on this machine; the hosted cache would only add uploads.
          cache: false
      - name: Check Linux native prerequisites
        run: |
          # The packages are installed once, system-wide, by an admin.
          missing=""
          # The FFmpeg build needs nasm, make, git, pkg-config and gcc (each tool is also its package name).
          for tool in nasm cmake make git pkg-config gcc python3; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          for package in libclang-dev libssl-dev libasound2-dev; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          # The X11 shell tests drive the app on a virtual display.
          command -v Xvfb >/dev/null || missing="$missing xvfb"
          command -v xdotool >/dev/null || missing="$missing xdotool"
          if [ -n "$missing" ]; then
            echo "::error::Missing native prerequisites. As root, run: apt-get install -y$missing"; exit 1
          fi
          llvm_lib="$(find /usr/lib -name "libclang.so" 2>/dev/null | head -n1)"
          if [ -n "$llvm_lib" ]; then
            echo "LIBCLANG_PATH=$(dirname "$llvm_lib")" >> "$GITHUB_ENV"
          fi
          # checkout cleans ignored files, which would make every run a cold build. A target
          # directory in the tool cache survives between runs.
          echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/fframes-target" >> "$GITHUB_ENV"
          df -h "$RUNNER_TOOL_CACHE" | tail -n1
      - name: Build the pinned FFmpeg install once
        run: |
          # Keyed on the build script, built in place (FFmpeg records its prefix) and marked
          # complete last, so an interrupted build is redone rather than used.
          key="$(sha256sum desktop/scripts/build-native-ffmpeg.py | cut -c1-16)"
          ffmpeg="$RUNNER_TOOL_CACHE/fframes-ffmpeg/$key"
          if [ ! -f "$ffmpeg/.complete" ]; then
            rm -rf "$ffmpeg" "$RUNNER_TEMP/ffmpeg-source"
            mkdir -p "$(dirname "$ffmpeg")"
            python3 desktop/scripts/build-native-ffmpeg.py --source "$RUNNER_TEMP/ffmpeg-source" --out "$ffmpeg"
            touch "$ffmpeg/.complete"
          fi
          echo "FFMPEG_DIR=$ffmpeg" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Test desktop workspace
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-harness -p studio-proto -p studio-theme -p studio-ui -p studio-markdown -p fframes-studio
      - name: Lint desktop workspace
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-harness -p studio-proto -p studio-theme -p studio-ui -p studio-markdown -p fframes-studio --all-targets -- -D warnings
      - name: Test studio protocol and runtime
        run: cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
      - name: Packaging and release gate tests
        run: |
          python3 desktop/scripts/test-packaging.py
          python3 desktop/scripts/test-release-gate.py
      - name: Build and render annotated worker
        if: inputs.full
        run: |
          cargo build --release --manifest-path desktop/fixtures/annotated-video-overlay/Cargo.toml
          cd desktop/fixtures/annotated-video-overlay
          cargo run --release -- frame 0 -o "$RUNNER_TEMP/worker-frame"
      - name: Real worker frame, anchor, crash and restart
        if: inputs.full
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test worker_roundtrip -- --ignored
      - name: Assemble and verify native offline SDK
        if: inputs.full
        run: python3 desktop/scripts/assemble-phase-zero-sdk.py --out "$RUNNER_TEMP/studio-sdk"
      - name: Install SDK and launch managed worker
        if: inputs.full
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p studio-engine --test managed_worker -- --ignored
      - name: Portable project and SDK relocation with real worker
        if: inputs.full
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p studio-engine --test portable_managed_worker -- --ignored
      - name: Revision-safe preview and compiled timeline integration
        if: inputs.full
        run: |
          SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p studio-engine --test preview_coordination -- --ignored
          SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test timeline_controls -- --ignored
      - name: Real SDK CPU pixels and audio mix parity
        if: inputs.full
        run: |
          fixture="$(mktemp -d /tmp/studio-m2-XXXXXX)"
          echo "STUDIO_M2_TMP=$fixture" >> "$GITHUB_ENV"
          export AUDIO_PREVIEW_FIXTURE_ROOT="$fixture/video"
          export AUDIO_PREVIEW_SDK_HOME="$RUNNER_TEMP/m2-home/.fframes/sdk"
          SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" AUDIO_PREVIEW_EVIDENCE="$RUNNER_TEMP/m2-parity.json" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test audio_preview real_sdk_frame_audio_and_retained_source -- --ignored
      - name: X11 shell with native input
        if: inputs.full
        run: |
          # The tests give the app its own HOME; keep the toolchain the job installed.
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          # SDK_ACTIVE is the SDK the audio parity step installed.
          SDK_ACTIVE="$RUNNER_TEMP/m2-home/.fframes/sdk/active" SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test x11_shell -- --ignored --test-threads=1
      # Test builds are named studio-test-*: the release workflow collects only the
      # fframes-studio-* packages its own jobs build.
      - name: Package native app and SDK test build
        if: inputs.full
        run: python3 desktop/scripts/package-phase-zero.py --out "$RUNNER_TEMP/studio-test-x86_64-unknown-linux-gnu" --sdk-bundle "$RUNNER_TEMP/studio-sdk"
      - name: Retain test build and evidence
        id: test-build
        if: always() && inputs.full
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/studio-test-x86_64-unknown-linux-gnu.zip
            ${{ runner.temp }}/worker-frame/*.png
            ${{ runner.temp }}/m2-parity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show how to download the test build
        if: always() && steps.test-build.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.test-build.outputs.artifact-url }}
        run: |
          {
            echo "### Linux test build"
            echo
            echo "[Download the zip]($ARTIFACT_URL) (kept 14 days), or run:"
            echo
            echo '```'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n studio-test-x86_64-unknown-linux-gnu -D studio-test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the audio parity fixture
        if: always()
        run: |
          if [ -n "${STUDIO_M2_TMP:-}" ]; then rm -rf "$STUDIO_M2_TMP"; fi

  windows:
    name: Desktop validation (self-hosted Windows)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      # A downloadable Windows build for every push to main, and for full runs.
      TEST_BUILD: ${{ inputs.full || github.ref == 'refs/heads/main' }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop-windows-self-hosted-setup
      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Test desktop workspace
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-harness -p studio-proto -p studio-theme -p studio-ui -p studio-markdown -p fframes-studio
      - name: Lint desktop workspace
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-harness -p studio-proto -p studio-theme -p studio-ui -p studio-markdown -p fframes-studio --all-targets -- -D warnings
      - name: Test studio protocol and runtime
        run: cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
      - name: Packaging and release gate tests
        run: |
          python desktop/scripts/test-packaging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/scripts/test-release-gate.py
      - name: Build and render annotated worker
        if: inputs.full
        run: |
          cargo build --release --manifest-path desktop/fixtures/annotated-video-overlay/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location desktop/fixtures/annotated-video-overlay
          cargo run --release -- frame 0 -o "$env:RUNNER_TEMP\worker-frame"
      - name: Real worker frame, anchor, crash and restart
        if: inputs.full
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test worker_roundtrip -- --ignored
      - name: Assemble and verify native offline SDK
        if: env.TEST_BUILD == 'true'
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\studio-sdk" -Recurse -Force -ErrorAction SilentlyContinue
          python desktop/scripts/assemble-phase-zero-sdk.py --out "$env:RUNNER_TEMP\studio-sdk"
      - name: Managed worker, portable relocation, preview and timeline integration
        if: inputs.full
        run: |
          $env:SDK_BUNDLE = "$env:RUNNER_TEMP\studio-sdk"
          foreach ($test in @("managed_worker", "portable_managed_worker")) {
            cargo test --locked --manifest-path desktop/Cargo.toml -p studio-engine --test $test -- --ignored
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --locked --manifest-path desktop/Cargo.toml -p studio-engine --test preview_coordination -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test timeline_controls -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AUDIO_PREVIEW_EVIDENCE = "$env:RUNNER_TEMP\m2-parity.json"
          cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test audio_preview real_sdk_frame_audio_and_retained_source -- --ignored
      - name: Preview latency budgets (install, cold, warm, edit)
        if: inputs.full
        run: |
          $env:SDK_BUNDLE = "$env:RUNNER_TEMP\studio-sdk"
          $env:PREVIEW_LATENCY_EVIDENCE = "$env:RUNNER_TEMP\preview-latency.json"
          cargo test --locked --manifest-path desktop/Cargo.toml -p studio-engine --test preview_latency -- --ignored --nocapture
      # Test builds are named studio-test-*: the release workflow collects only the
      # fframes-studio-* packages its own jobs build.
      - name: Package native app and SDK test build
        if: env.TEST_BUILD == 'true'
        run: |
          $out = "$env:RUNNER_TEMP\studio-test-x86_64-pc-windows-msvc"
          Remove-Item -LiteralPath $out, "$out.zip" -Recurse -Force -ErrorAction SilentlyContinue
          python desktop/scripts/package-phase-zero.py --out $out --sdk-bundle "$env:RUNNER_TEMP\studio-sdk"
      - name: Retain test build and audio parity evidence
        id: test-build
        if: always() && env.TEST_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-x86_64-pc-windows-msvc
          path: |
            ${{ runner.temp }}/studio-test-x86_64-pc-windows-msvc.zip
            ${{ runner.temp }}/worker-frame/*.png
            ${{ runner.temp }}/m2-parity.json
            ${{ runner.temp }}/preview-latency.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show how to download the test build
        if: always() && steps.test-build.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.test-build.outputs.artifact-url }}
        run: |
          $command = "gh run download $env:GITHUB_RUN_ID -R $env:GITHUB_REPOSITORY -n studio-test-x86_64-pc-windows-msvc -D studio-test"
          $fence = '```'
          $summary = "### Windows test build`n`n[Download the zip]($env:ARTIFACT_URL) (kept 14 days), or run:`n`n$fence`n$command`n$fence`n"
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary)
