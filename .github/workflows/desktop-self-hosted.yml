name: Desktop self-hosted validation

on:
  push:
    paths:
      - "desktop/**"
      - "fframes-studio-*/**"
      - "fframes/**"
      - "fframes-media/**"
      - "svgr-macro/**"
      - "media-dir-macro/**"
      - "webvtt-parser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-self-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Desktop validation (self-hosted Linux)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          # The build folder persists on this machine; the hosted cache would only add uploads.
          cache: false
      - name: Check Linux native prerequisites
        run: |
          # The runner user has no sudo: the packages are installed once, system-wide, by an admin.
          missing=""
          # The FFmpeg build needs nasm, make, git, pkg-config and gcc (each tool is also its package name).
          for tool in nasm cmake make git pkg-config gcc python3; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          for package in libclang-dev libssl-dev libasound2-dev; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          # The presentation test drives the app on a virtual display.
          command -v Xvfb >/dev/null || missing="$missing xvfb"
          command -v xdotool >/dev/null || missing="$missing xdotool"
          python3 -c "import PIL" 2>/dev/null || missing="$missing python3-pil"
          if [ -n "$missing" ]; then
            echo "::error::Missing native prerequisites. As root, run: apt-get install -y$missing"; exit 1
          fi
          # Only the advisory audio stress uses these.
          for tool in pulseaudio pactl; do
            command -v "$tool" >/dev/null || echo "::warning::$tool is missing; the advisory M2 audio stress will fail (apt-get install -y pulseaudio pulseaudio-utils)"
          done
          llvm_lib="$(find /usr/lib -name "libclang.so" 2>/dev/null | head -n1)"
          if [ -n "$llvm_lib" ]; then
            echo "LIBCLANG_PATH=$(dirname "$llvm_lib")" >> "$GITHUB_ENV"
          fi
          # checkout cleans ignored files, which would make every run a cold build. A target
          # directory in the tool cache survives between runs.
          echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/fframes-target" >> "$GITHUB_ENV"
          df -h "$RUNNER_TOOL_CACHE" | tail -n1
      - name: Build the pinned FFmpeg install once
        run: |
          # Keyed on the build script, built in place (FFmpeg records its prefix) and marked
          # complete last, so an interrupted build is redone rather than used.
          key="$(sha256sum desktop/scripts/build-native-ffmpeg.py | cut -c1-16)"
          ffmpeg="$RUNNER_TOOL_CACHE/fframes-ffmpeg/$key"
          if [ ! -f "$ffmpeg/.complete" ]; then
            rm -rf "$ffmpeg" "$RUNNER_TEMP/ffmpeg-source"
            mkdir -p "$(dirname "$ffmpeg")"
            python3 desktop/scripts/build-native-ffmpeg.py --source "$RUNNER_TEMP/ffmpeg-source" --out "$ffmpeg"
            touch "$ffmpeg/.complete"
          fi
          echo "FFMPEG_DIR=$ffmpeg" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Test desktop workspace
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio
      - name: Lint desktop workspace
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio --all-targets -- -D warnings
      - name: Test studio protocol and runtime
        run: cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
      - name: Packaging tests and qualification ledgers
        run: |
          python3 desktop/scripts/test-packaging.py
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m0-results.json
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m2-results.json
      - name: Build and render annotated worker
        run: |
          cargo build --release --manifest-path desktop/fixtures/annotated-video-overlay/Cargo.toml
          cd desktop/fixtures/annotated-video-overlay
          cargo run --release -- frame 0 -o "$RUNNER_TEMP/worker-frame"
      - name: Real worker frame, anchor, crash and restart
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test worker_roundtrip -- --ignored
      - name: Assemble and verify native offline SDK
        run: python3 desktop/scripts/assemble-phase-zero-sdk.py --out "$RUNNER_TEMP/studio-sdk"
      - name: Install SDK and launch managed worker
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test managed_worker -- --ignored
      - name: Portable project and SDK relocation with real worker
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test portable_managed_worker -- --ignored
      - name: Revision-safe preview and compiled timeline integration
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test preview_coordination --test timeline_controls -- --ignored
      - name: Real SDK CPU pixels and audio mix parity
        run: |
          fixture="$(mktemp -d /tmp/studio-m2-XXXXXX)"
          echo "STUDIO_M2_TMP=$fixture" >> "$GITHUB_ENV"
          echo "STUDIO_M2_FIXTURE=$fixture/video" >> "$GITHUB_ENV"
          echo "STUDIO_M2_HOME=$RUNNER_TEMP/m2-home" >> "$GITHUB_ENV"
          export AUDIO_PREVIEW_FIXTURE_ROOT="$fixture/video"
          export AUDIO_PREVIEW_SDK_HOME="$RUNNER_TEMP/m2-home/.fframes/sdk"
          SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" AUDIO_PREVIEW_EVIDENCE="$RUNNER_TEMP/m2-parity.json" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test audio_preview real_sdk_frame_audio_and_retained_source -- --ignored
      - name: Linux M2 native virtual-output stress and cleanup
        # Advisory until it has passed on a runner with a stable virtual audio device.
        continue-on-error: true
        run: |
          cargo build --locked --manifest-path desktop/Cargo.toml -p fframes-studio --bin fframes-studio
          FFRAMES_SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" python3 desktop/scripts/qualify-m2-playback.py --application "$CARGO_TARGET_DIR/debug/fframes-studio" --project "$STUDIO_M2_FIXTURE" --sdk-home "$STUDIO_M2_HOME" --out "$RUNNER_TEMP/m2-native" --virtual-audio --inject-build-failures
      # Test builds are named studio-test-*: the release workflow collects only
      # fframes-studio-* packages, which come from hosted runners.
      - name: Package native app and SDK test build
        run: python3 desktop/scripts/package-phase-zero.py --out "$RUNNER_TEMP/studio-test-x86_64-unknown-linux-gnu" --sdk-bundle "$RUNNER_TEMP/studio-sdk"
      - name: Native presentation, input and source click
        # The same check as the hosted isolated-account run, as the runner user: that variant
        # needs root and a throwaway machine, so it runs on hosted Ubuntu for main.
        run: python3 desktop/scripts/qualify-linux-native.py --application "$RUNNER_TEMP/studio-test-x86_64-unknown-linux-gnu/bin/fframes-studio" --bundle "$RUNNER_TEMP/studio-sdk" --out "$RUNNER_TEMP/linux-native-evidence"
      - name: Retain test build and evidence
        id: test-build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/studio-test-x86_64-unknown-linux-gnu.zip
            ${{ runner.temp }}/worker-frame/*.png
            ${{ runner.temp }}/linux-native-evidence/presentation.json
            ${{ runner.temp }}/linux-native-evidence/native-window.png
            ${{ runner.temp }}/linux-native-evidence/application.log
            ${{ runner.temp }}/m2-parity.json
            ${{ runner.temp }}/m2-native/*.json
            ${{ runner.temp }}/m2-native/*.png
            ${{ runner.temp }}/m2-native/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Show how to download the test build
        if: always() && steps.test-build.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.test-build.outputs.artifact-url }}
        run: |
          {
            echo "### Linux test build"
            echo
            echo "[Download the zip]($ARTIFACT_URL) (kept 14 days), or run:"
            echo
            echo '```'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n studio-test-x86_64-unknown-linux-gnu -D studio-test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the M2 fixture
        if: always()
        run: if [ -n "${STUDIO_M2_TMP:-}" ]; then rm -rf "$STUDIO_M2_TMP"; fi

  windows:
    name: Desktop validation (self-hosted Windows)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      # The runner service does not inherit the interactive profile: it has no ~/.cargo/bin,
      # FFMPEG_DIR, LIBCLANG_PATH or `python` (spawned by test fixtures) on its environment.
      # setup-rust-toolchain is deliberately not used here: on this shared machine it reinstalled
      # rustup with a GNU default host, and the job left ~/.cargo/bin without rustup.exe.
      - name: Prepare the Windows build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # AppendAllText writes UTF-8 without a BOM, which Windows PowerShell's Out-File would add.
          function Add-Line([string]$File, [string]$Line) { [IO.File]::AppendAllText($File, "$Line`n") }
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path (Join-Path $cargoBin "rustup.exe"))) { throw "rustup is not installed for the runner user ($cargoBin)" }
          Add-Line $env:GITHUB_PATH $cargoBin
          # An explicit MSVC triple, so the result never depends on rustup's default host.
          & (Join-Path $cargoBin "rustup.exe") toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed" }
          Add-Line $env:GITHUB_ENV "RUSTUP_TOOLCHAIN=1.98.1-x86_64-pc-windows-msvc"

          # Same pinned FFmpeg build as the release workflow, kept in the runner's tool cache.
          $distribution = "ffmpeg-n9.0.2-22-g46d8f462ee-win64-gpl-shared-9.0"
          $release = "autobuild-2026-10-07-13-07"
          $expected = "124799F0643A75EB84A64A589F1ABAC8F81732587942F3F34458688036153F0D"
          $cache = Join-Path $env:RUNNER_TOOL_CACHE "fframes-ffmpeg"
          $ffmpeg = Join-Path $cache $distribution
          if (-not (Test-Path (Join-Path $ffmpeg "bin\avcodec-63.dll"))) {
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "$distribution.zip"
            Invoke-WebRequest -UseBasicParsing "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/$distribution.zip" -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw "FFmpeg download checksum mismatch" }
            # Windows' bsdtar reads ZIPs and copes with long paths, unlike Expand-Archive. Extract
            # into a staging folder and move it into place, so a failure leaves no partial cache.
            $staging = Join-Path $cache ".partial"
            Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $staging | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $staging
            if ($LASTEXITCODE -ne 0) { Remove-Item -LiteralPath $staging -Recurse -Force; throw "FFmpeg extraction failed" }
            Remove-Item -LiteralPath $ffmpeg -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item -LiteralPath (Join-Path $staging $distribution) -Destination $ffmpeg
            Remove-Item -LiteralPath $staging, $archive -Recurse -Force
          }
          Add-Line $env:GITHUB_ENV "FFMPEG_DIR=$ffmpeg"
          Add-Line $env:GITHUB_PATH (Join-Path $ffmpeg "bin")

          $llvm = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvm "libclang.dll"))) { throw "LLVM (libclang) not found at $llvm" }
          Add-Line $env:GITHUB_ENV "LIBCLANG_PATH=$llvm"

          $python = & py -3 -c "import os, sys; print(os.path.dirname(sys.executable))"
          if ($LASTEXITCODE -ne 0 -or -not $python) { throw "No Python 3 found through the py launcher" }
          Add-Line $env:GITHUB_PATH $python

          # checkout cleans ignored files, which would make every run a cold build. A target
          # directory in the tool cache survives between runs (and keeps paths short).
          Add-Line $env:GITHUB_ENV "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TOOL_CACHE 'fframes-target')"
      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Test desktop workspace
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio
      - name: Lint desktop workspace
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio --all-targets -- -D warnings
      - name: Test studio protocol and runtime
        run: cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
      - name: Packaging tests and qualification ledgers
        run: |
          python desktop/scripts/test-packaging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/scripts/validate-qualification.py desktop/qualification/m0-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/scripts/validate-qualification.py desktop/qualification/m2-results.json
      - name: Build and render annotated worker
        run: |
          cargo build --release --manifest-path desktop/fixtures/annotated-video-overlay/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location desktop/fixtures/annotated-video-overlay
          cargo run --release -- frame 0 -o "$env:RUNNER_TEMP\worker-frame"
      - name: Real worker frame, anchor, crash and restart
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test worker_roundtrip -- --ignored
      - name: Assemble and verify native offline SDK
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\studio-sdk" -Recurse -Force -ErrorAction SilentlyContinue
          python desktop/scripts/assemble-phase-zero-sdk.py --out "$env:RUNNER_TEMP\studio-sdk"
      - name: Managed worker, portable relocation, preview and timeline integration
        run: |
          $env:SDK_BUNDLE = "$env:RUNNER_TEMP\studio-sdk"
          foreach ($test in @("managed_worker", "portable_managed_worker")) {
            cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test $test -- --ignored
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test preview_coordination --test timeline_controls -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AUDIO_PREVIEW_EVIDENCE = "$env:RUNNER_TEMP\m2-parity.json"
          cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test audio_preview real_sdk_frame_audio_and_retained_source -- --ignored
      # Test builds are named studio-test-*: the release workflow collects only
      # fframes-studio-* packages, which come from hosted runners.
      - name: Package native app and SDK test build
        run: |
          $out = "$env:RUNNER_TEMP\studio-test-x86_64-pc-windows-msvc"
          Remove-Item -LiteralPath $out, "$out.zip" -Recurse -Force -ErrorAction SilentlyContinue
          python desktop/scripts/package-phase-zero.py --out $out --sdk-bundle "$env:RUNNER_TEMP\studio-sdk"
      - name: Retain test build and M2 evidence
        id: test-build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-x86_64-pc-windows-msvc
          path: |
            ${{ runner.temp }}/studio-test-x86_64-pc-windows-msvc.zip
            ${{ runner.temp }}/worker-frame/*.png
            ${{ runner.temp }}/m2-parity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show how to download the test build
        if: always() && steps.test-build.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.test-build.outputs.artifact-url }}
        run: |
          $command = "gh run download $env:GITHUB_RUN_ID -R $env:GITHUB_REPOSITORY -n studio-test-x86_64-pc-windows-msvc -D studio-test"
          $fence = '```'
          $summary = "### Windows test build`n`n[Download the zip]($env:ARTIFACT_URL) (kept 14 days), or run:`n`n$fence`n$command`n$fence`n"
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary)
