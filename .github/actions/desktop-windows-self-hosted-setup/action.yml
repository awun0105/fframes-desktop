name: Desktop self-hosted Windows setup
description: >
  The pinned MSVC Rust toolchain from the runner user's rustup, the pinned FFmpeg build kept in the
  runner's tool cache, LLVM, Python and Git Bash on PATH, and a build folder that survives between
  runs. Used by the self-hosted validation and the Windows release build.
runs:
  using: composite
  steps:
    # The runner does not inherit the interactive profile: it has no ~/.cargo/bin, FFMPEG_DIR,
    # LIBCLANG_PATH or `python` (spawned by test fixtures) on its environment.
    # setup-rust-toolchain is deliberately not used: on this shared machine it reinstalled rustup
    # with a GNU default host, and the job left ~/.cargo/bin without rustup.exe.
    - name: Prepare the Windows build environment
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        # AppendAllText writes UTF-8 without a BOM, which Windows PowerShell's Out-File would add.
        function Add-Line([string]$File, [string]$Line) { [IO.File]::AppendAllText($File, "$Line`n") }
        $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
        if (-not (Test-Path (Join-Path $cargoBin "rustup.exe"))) { throw "rustup is not installed for the runner user ($cargoBin)" }
        Add-Line $env:GITHUB_PATH $cargoBin
        # An explicit MSVC triple, so the result never depends on rustup's default host.
        & (Join-Path $cargoBin "rustup.exe") toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy --no-self-update
        if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed" }
        Add-Line $env:GITHUB_ENV "RUSTUP_TOOLCHAIN=1.98.1-x86_64-pc-windows-msvc"

        # The pinned FFmpeg build, kept in the runner's tool cache.
        $distribution = "ffmpeg-n9.0.2-22-g46d8f462ee-win64-gpl-shared-9.0"
        $release = "autobuild-2026-10-07-13-07"
        $expected = "124799F0643A75EB84A64A589F1ABAC8F81732587942F3F34458688036153F0D"
        $cache = Join-Path $env:RUNNER_TOOL_CACHE "fframes-ffmpeg"
        $ffmpeg = Join-Path $cache $distribution
        if (-not (Test-Path (Join-Path $ffmpeg "bin\avcodec-63.dll"))) {
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "$distribution.zip"
          Invoke-WebRequest -UseBasicParsing "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/$distribution.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw "FFmpeg download checksum mismatch" }
          # Windows' bsdtar reads ZIPs and copes with long paths, unlike Expand-Archive. Extract
          # into a staging folder and move it into place, so a failure leaves no partial cache.
          $staging = Join-Path $cache ".partial"
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $staging
          if ($LASTEXITCODE -ne 0) { Remove-Item -LiteralPath $staging -Recurse -Force; throw "FFmpeg extraction failed" }
          Remove-Item -LiteralPath $ffmpeg -Recurse -Force -ErrorAction SilentlyContinue
          Move-Item -LiteralPath (Join-Path $staging $distribution) -Destination $ffmpeg
          Remove-Item -LiteralPath $staging, $archive -Recurse -Force
        }
        Add-Line $env:GITHUB_ENV "FFMPEG_DIR=$ffmpeg"
        Add-Line $env:GITHUB_PATH (Join-Path $ffmpeg "bin")

        $llvm = Join-Path $env:ProgramFiles "LLVM\bin"
        if (-not (Test-Path (Join-Path $llvm "libclang.dll"))) { throw "LLVM (libclang) not found at $llvm" }
        Add-Line $env:GITHUB_ENV "LIBCLANG_PATH=$llvm"

        $python = & py -3 -c "import os, sys; print(os.path.dirname(sys.executable))"
        if ($LASTEXITCODE -ne 0 -or -not $python) { throw "No Python 3 found through the py launcher" }
        Add-Line $env:GITHUB_PATH $python

        # `shell: bash` steps resolve bash from PATH; Git for Windows puts only git.exe there.
        $gitBin = Join-Path $env:ProgramFiles "Git\bin"
        if (-not (Test-Path (Join-Path $gitBin "bash.exe"))) { throw "Git Bash not found at $gitBin" }
        Add-Line $env:GITHUB_PATH $gitBin
        # `shell: pwsh` steps, for a runner started before PowerShell 7 was on the machine PATH.
        $pwsh = Join-Path $env:ProgramFiles "PowerShell\7"
        if (Test-Path (Join-Path $pwsh "pwsh.exe")) { Add-Line $env:GITHUB_PATH $pwsh }
        # sign-windows-package.ps1 finds signtool on PATH; no MSVC developer shell puts it there.
        $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
          Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
        if ($signTool) { Add-Line $env:GITHUB_PATH $signTool.DirectoryName }

        # checkout cleans ignored files, which would make every run a cold build. A target
        # directory in the tool cache survives between runs (and keeps paths short).
        Add-Line $env:GITHUB_ENV "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TOOL_CACHE 'fframes-target')"
