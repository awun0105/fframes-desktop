[package]
name = "studio-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Component kit, editor layout and panels for fframes studio"

[lib]
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
studio-engine = { workspace = true }
studio-proto = { workspace = true }
async-channel = "2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
