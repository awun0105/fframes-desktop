# Feasibility spike: Cap's GPUI fork (wingleeio/zed 5d1f83d plus Cap's three
# patches plus seven upstream Zed fixes) mirrored at khanhthanhdev/zed-cap,
# branch cap-patches. Its own workspace so the desktop workspace's upstream Zed
# pin does not resolve here. Deleted in M1 phase 2.
[workspace]
resolver = "2"
members = [".", "ff-ui"]

[workspace.dependencies]
gpui = { git = "https://github.com/khanhthanhdev/zed-cap", rev = "c32bfd3962e172b566c9d5514f4fa5cf325e9b06" }
# Cap's exact feature set (apps/desktop-gpui/Cargo.toml), which it ships on
# Windows, macOS and Linux.
gpui_platform = { git = "https://github.com/khanhthanhdev/zed-cap", rev = "c32bfd3962e172b566c9d5514f4fa5cf325e9b06", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
smallvec = "1"

[package]
name = "cap-gpui-hello"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
ff-ui = { path = "ff-ui" }
raw-window-handle = "0.6"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# Cap's dev profile: gpui is unusably slow with unoptimized dependencies.
[profile.dev]
opt-level = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"
