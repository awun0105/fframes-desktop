[package]
name = "kit-props"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
fframes = { path = "../../../fframes", version = "1.3.0", features = ["compile-time-svgtree"] }
fframes-kit = { git = "https://github.com/khanhthanhdev/fframes-kit", rev = "01f5b326ecb74e2dfab54c215ba3de7e217eb965" }
fframes-studio-kit = { path = "../../../fframes-studio-kit" }
fframes-studio-protocol = { path = "../../../fframes-studio-protocol", version = "0.2.0" }
fframes-studio-runtime = { path = "../../../fframes-studio-runtime", version = "0.2.0" }

# The kit builds against crates.io fframes; this makes it use the same fframes as Studio.
[patch.crates-io]
fframes = { path = "../../../fframes" }
