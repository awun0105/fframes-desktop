[workspace]
resolver = "2"
members = [
    "app",
    "crates/studio-project",
    "crates/studio-presets",
    "crates/studio-engine",
    "crates/studio-bootstrap",
    "crates/studio-sdk",
    "crates/studio-harness",
    "crates/studio-proto",
    "crates/studio-theme",
    "crates/studio-ui",
    "crates/studio-markdown",
    "crates/studio-test-support",
]

[workspace.dependencies]
studio-project = { path = "crates/studio-project" }
studio-engine = { path = "crates/studio-engine" }
studio-presets = { path = "crates/studio-presets" }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
studio-bootstrap = { path = "crates/studio-bootstrap" }
fframes-studio-protocol = { path = "../fframes-studio-protocol" }
studio-sdk = { path = "crates/studio-sdk" }
studio-harness = { path = "crates/studio-harness" }
studio-proto = { path = "crates/studio-proto" }
studio-theme = { path = "crates/studio-theme" }
studio-ui = { path = "crates/studio-ui" }
studio-markdown = { path = "crates/studio-markdown" }
pulldown-cmark = { version = "0.12", default-features = false }
sha2 = "0.10"
semver = "1.0"
ring = "0.17"
tar = "0.4"
flate2 = "1.0"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
smallvec = "1.16"
cpal = "=0.18.2"
agent-client-protocol = "=2.2.0"
futures = "0.3"

# Cap's GPUI fork: wingleeio/zed with Cap's three patches and a few upstream Zed fixes, mirrored
# on the `cap-patches` branch of khanhthanhdev/zed-cap. Never pin below cb5d0daa (Cap's last
# patch); earlier fork commits break the DirectX quad and sprite layout.
# Pinned to awun0105/zed `fix/vietnamese-glyph-offsets`: c32bfd39 plus a fix that applies shaping
# offsets to combining marks (Vietnamese diacritics) in the Linux text system.
[workspace.dependencies.gpui]
git = "https://github.com/awun0105/zed"
rev = "09c457348b4611c8890dcc680ea61627bb6631ae"

# Cap's feature set; each feature only reaches its own platform crate.
[workspace.dependencies.gpui_platform]
git = "https://github.com/awun0105/zed"
rev = "09c457348b4611c8890dcc680ea61627bb6631ae"
features = ["wayland", "x11", "font-kit", "runtime_shaders"]

# The preview converts every shown frame; unoptimised it takes ~50 ms at 1080p.
[profile.dev.package.studio-ui]
opt-level = 3
