[package]
name = "fframes-studio-kit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "fframes Studio's props store for fframes-kit components: props.json, editor identities and the props panel hooks"

# Its own workspace: fframes-kit builds against crates.io fframes, which the patch below
# replaces with this repository's, so the kit and Studio share one fframes.
[workspace]

[dependencies]
fframes = { path = "../fframes", version = "1.3.0", default-features = false }
fframes-kit = { git = "https://github.com/khanhthanhdev/fframes-kit", rev = "01f5b326ecb74e2dfab54c215ba3de7e217eb965", features = ["studio"] }
fframes-studio-protocol = { path = "../fframes-studio-protocol", version = "0.2.0" }
fframes-studio-runtime = { path = "../fframes-studio-runtime", version = "0.2.0", default-features = false }

[dev-dependencies]
fframes = { path = "../fframes", version = "1.3.0", features = ["compile-time-svgtree"] }
serde_json = "1.0"

[patch.crates-io]
fframes = { path = "../fframes" }
